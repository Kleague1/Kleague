name: Update heatmaps

# 매주 월요일 오전 9시(KST)에 최신 데이터로 히트맵을 다시 생성해 커밋한다.
# (일요일 경기 결과가 반영된 시점) GitHub cron 은 UTC 기준이라 00:00 UTC = 09:00 KST.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}          # 저장소 Actions 탭에서 수동 실행 버튼

permissions:
  contents: write                # 갱신된 이미지를 커밋/푸시하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          sudo fc-cache -f
          rm -rf ~/.cache/matplotlib      # matplotlib 폰트 캐시 갱신 강제

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate heatmaps
        run: python heatmap.py

      - name: Commit updated images (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmap_k1.png heatmap_k2.png
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 주간 히트맵 자동 갱신 [skip ci]"
            git push
          fi
